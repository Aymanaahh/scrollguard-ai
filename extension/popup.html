<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScrollGuard AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 12px;
      width: 250px;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005a9e;
    }
    #results {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.4;
    }
    .safe { color: green; }
    .suspicious { color: orange; }
    .dangerous { color: red; }
  </style>
</head>
<body>
  <h1>ScrollGuard AI</h1>
  <button id="scanBtn">Scan Current Page</button>
  <div id="results"></div>

  <script src="popup.js"></script>
</body>
</html>
